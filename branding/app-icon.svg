<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFEFEB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- Big Sur squircle, 824x824 centered -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185"
          fill="url(#bg)" stroke="#000000" stroke-opacity="0.08" stroke-width="2"/>
  </g>

  <!-- regex literal motif: / \d+ /  with the pattern on an accent pill -->
  <rect x="292" y="407" width="440" height="210" rx="34"
        fill="#037A55" fill-opacity="0.12" stroke="#037A55" stroke-opacity="0.55" stroke-width="7"/>
  <text x="230" y="580" font-family="monospace" font-weight="bold" font-size="170"
        fill="#86868B" text-anchor="middle">/</text>
  <text x="512" y="583" font-family="monospace" font-weight="bold" font-size="180"
        fill="#1D1D1F" text-anchor="middle">\d+</text>
  <text x="794" y="580" font-family="monospace" font-weight="bold" font-size="170"
        fill="#86868B" text-anchor="middle">/</text>
</svg>
