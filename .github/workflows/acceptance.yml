name: Product Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  RIVET_PIN: de1fb8997539d34ba029064f500f6903b955b5a7

jobs:
  windows:
    name: Windows packaged WinUI acceptance
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.3'
          architecture: x64
          distribution: full
          variant: CS
      - name: Install pinned Rivet and dependencies
        shell: pwsh
        run: raco pkg install --auto --no-docs "https://github.com/turinglambdaai/rivet.git#$env:RIVET_PIN" crypto
      - name: Run executable product acceptance
        run: raco rivet acceptance --json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regexmate-acceptance-windows
          path: .rivet/acceptance/
          if-no-files-found: warn

  macos:
    name: macOS packaged SwiftUI acceptance (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.3'
          architecture: ${{ matrix.arch }}
          distribution: full
          variant: CS
      - name: Install pinned Rivet and dependencies
        run: raco pkg install --auto --no-docs "https://github.com/turinglambdaai/rivet.git#${RIVET_PIN}" crypto
      - name: Run executable product acceptance
        run: raco rivet acceptance --json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regexmate-acceptance-macos-${{ matrix.arch }}
          path: .rivet/acceptance/
          if-no-files-found: warn

  linux:
    name: Linux packaged GTK4 acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.3'
          architecture: x64
          distribution: full
          variant: CS
      - name: Install native and accessibility dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgtk-4-dev libglib2.0-dev libsecret-1-dev \
            liblz4-dev zlib1g-dev libncurses-dev weston at-spi2-core python3-pyatspi
      - name: Install pinned Rivet and dependencies
        run: raco pkg install --auto --no-docs "https://github.com/turinglambdaai/rivet.git#${RIVET_PIN}" crypto
      - name: Remember full Racket command path
        run: echo "FULL_RACKET_BIN=$(dirname "$(command -v raco)")" >> "$GITHUB_ENV"
      - name: Set up embeddable Racket CS
        uses: turinglambdaai/rivet/.github/actions/setup-embed-racket@de1fb8997539d34ba029064f500f6903b955b5a7
      - name: Run executable product acceptance
        run: PATH="$FULL_RACKET_BIN:$PATH" dbus-run-session -- raco rivet acceptance --json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regexmate-acceptance-linux
          path: .rivet/acceptance/
          if-no-files-found: warn
