name: Product Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Every rivet install below names the pinned commit literally so
# `raco rivet doctor --release` sees a non-empty pin in the text it scans.
jobs:
  windows:
    name: Windows packaged WinUI acceptance
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.3'
          architecture: x64
          distribution: full
          variant: CS
      - name: Install pinned Rivet and dependencies
        shell: pwsh
        run: raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#9d766b4acab672844093204cb4845ef4ef933d2c" crypto
      - name: Run executable product acceptance
        run: raco rivet acceptance --json > acceptance-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regexmate-acceptance-windows-${{ github.run_attempt }}
          path: |
            .rivet/acceptance/
            dist/
            acceptance-report.json
          if-no-files-found: warn

  macos:
    name: macOS packaged SwiftUI acceptance (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.3'
          architecture: ${{ matrix.arch }}
          distribution: full
          variant: CS
      - name: Install pinned Rivet and dependencies
        run: raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#9d766b4acab672844093204cb4845ef4ef933d2c" crypto
      - name: Run executable product acceptance
        run: raco rivet acceptance --json > acceptance-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regexmate-acceptance-macos-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            .rivet/acceptance/
            dist/
            acceptance-report.json
          if-no-files-found: warn

  linux:
    name: Linux packaged GTK4 acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.3'
          architecture: x64
          distribution: full
          variant: CS
      - name: Install native and accessibility dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgtk-4-dev libglib2.0-dev libsecret-1-dev \
            liblz4-dev zlib1g-dev libncurses-dev weston at-spi2-core python3-pyatspi
      - name: Install pinned Rivet and dependencies
        run: raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#9d766b4acab672844093204cb4845ef4ef933d2c" crypto
      - name: Remember full Racket command path
        run: echo "FULL_RACKET_BIN=$(dirname "$(command -v raco)")" >> "$GITHUB_ENV"
      - name: Set up embeddable Racket CS
        uses: turlamai/rivet/.github/actions/setup-embed-racket@9d766b4acab672844093204cb4845ef4ef933d2c
      - name: Run executable product acceptance
        run: PATH="$FULL_RACKET_BIN:$PATH" dbus-run-session -- raco rivet acceptance --json > acceptance-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regexmate-acceptance-linux-${{ github.run_attempt }}
          path: |
            .rivet/acceptance/
            dist/
            acceptance-report.json
          if-no-files-found: warn

  # rivet v0.12.0 folds the per-platform reports for one commit into a single
  # machine-readable verdict: a required kind/platform cell is proven only by
  # a passing suite on that platform, and a missing platform is never
  # silently green (docs/product-acceptance.md in the rivet repo).
  matrix:
    name: Cross-platform verification matrix
    needs: [windows, macos, linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: reports
          # Single-job reruns create a new attempt only for that platform.
          # Fetch every attempt, then explicitly select the newest artifact
          # for each platform; never mix in a stale failed attempt.
          pattern: regexmate-acceptance-*
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.3'
          architecture: x64
          distribution: full
          variant: CS
      - name: Install pinned Rivet
        run: raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#9d766b4acab672844093204cb4845ef4ef933d2c" crypto
      - name: Select latest passing-attempt artifacts per platform
        # A one-job rerun must preserve the successful reports from earlier
        # attempts, while selecting the newest result for the retried platform.
        # The Linux AT-SPI daemon can prefix stdout before its JSON report.
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          platforms = ("windows", "macos-arm64", "macos-x64", "linux")
          latest = {}
          for report in Path("reports").glob("*/acceptance-report.json"):
              match = re.fullmatch(
                  r"regexmate-acceptance-(windows|macos-arm64|macos-x64|linux)-(\d+)",
                  report.parent.name,
              )
              if not match:
                  continue
              platform, attempt = match.group(1), int(match.group(2))
              if platform not in latest or attempt > latest[platform][0]:
                  latest[platform] = (attempt, report)

          missing = set(platforms) - set(latest)
          if missing:
              sys.exit(f"missing acceptance artifacts for: {', '.join(sorted(missing))}")

          with open("selected-reports.txt", "w") as selected:
              for platform in platforms:
                  attempt, report = latest[platform]
                  raw = report.read_text(errors="ignore")
                  start, end = raw.find("{"), raw.rfind("}") + 1
                  if start == -1 or end == 0:
                      sys.exit(f"empty or non-JSON acceptance report: {report}")
                  if raw != raw[start:end]:
                      report.write_text(raw[start:end])
                  selected.write(str(report) + "\n")
                  print(f"{platform}: attempt {attempt}, {report}")
          PY
      - name: Aggregate per-platform acceptance reports
        run: |
          mapfile -t reports < selected-reports.txt
          raco rivet matrix "${reports[@]}"
