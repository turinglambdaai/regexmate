name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }}, racket ${{ matrix.racket }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        racket: ['9.2']

    steps:
      - uses: actions/checkout@v4

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: ${{ matrix.racket }}
          architecture: x64
          distribution: full
          variant: CS

      - name: Install Rivet (pinned) and crypto (updater dependency)
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#9d766b4acab672844093204cb4845ef4ef933d2c' crypto

      - name: Compile
        run: raco make main.rkt run-tests.rkt

      - name: Unit tests
        run: racket run-tests.rkt


      - name: Version metadata check
        run: racket scripts/check-version.rkt

      # rivet-schema.json is the committed backend-contract baseline; this
      # fails when a backend change breaks the RPC contract the native hosts
      # were generated against.
      - name: Backend schema baseline check
        run: raco rivet schema check rivet-schema.json --json

      # rivet release gate: regenerated clients must match the tree (the
      # committed Kotlin client included), the schema baseline must hold,
      # updater calls may only use keywords the pinned rivet accepts, and
      # every dependency pin must be non-empty.
      - name: Release gate (doctor)
        run: raco rivet doctor --release

      - name: CLI smoke test
        shell: bash
        run: bash scripts/smoke.sh

  linux-host:
    name: linux host (GTK4 compile)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Racket (headers for the embedding includes)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.3'
          architecture: x64
          distribution: full
          variant: CS

      - name: Install GTK4
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev

      - name: Clone rivet (host platform headers, pinned)
        run: git clone https://github.com/turinglambdaai/rivet.git "$RUNNER_TEMP/rivet" && git -C "$RUNNER_TEMP/rivet" checkout 9d766b4acab672844093204cb4845ef4ef933d2c

      # Compile gate only: the release workflow does the full embedded-CS
      # build. This catches GTK 4.6 API and C++ mistakes on every push.
      - name: Compile-check the GTK4 host
        run: |
          racket_include="$(racket -e '(require setup/dirs) (display (path->string (find-include-dir)))')"
          g++ -std=c++20 -fsyntax-only -Wall -Wextra -Wpedantic \
            -I linux \
            -I "$RUNNER_TEMP/rivet/platform/linux/runtime" \
            -I "$RUNNER_TEMP/rivet/runtime/include" \
            -I "$racket_include" \
            $(pkg-config --cflags gtk4) \
            linux/src/main.cpp

  portable-windows-zip:
    name: Windows extracted CLI ZIP and runtime
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.3'
          architecture: x64
          distribution: full
          variant: CS
      - name: Install pinned Rivet and crypto
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#9d766b4acab672844093204cb4845ef4ef933d2c' crypto
      - name: Build the native Windows CLI distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          raco exe -o build/regexmate.exe main.rkt
          raco distribute stage/bin build/regexmate.exe
          test -f stage/bin/regexmate.exe
          test ! -f stage/regexmate.exe
      - name: Archive the same Windows bin layout as the release
        shell: pwsh
        run: Compress-Archive -Path stage/* -DestinationPath regexmate-ci-windows-x86_64.zip
      - name: Exercise extracted Windows CLI with real Racket DLLs
        shell: pwsh
        run: '& scripts/windows-cli-archive-smoke.ps1 -Archive regexmate-ci-windows-x86_64.zip'
