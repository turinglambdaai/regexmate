name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    name: Verify release metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.2'

      - name: Sanity-check scripts
        run: |
          bash -n scripts/smoke.sh
          test -f CHANGELOG.md

      - name: Tag must match repository version
        run: racket scripts/check-version.rkt "$GITHUB_REF_NAME"

      - name: Changelog must have a section for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md

  build:
    name: Build (${{ matrix.asset }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: regexmate-linux-x86_64
            archive: tar.gz
            racket-arch: x64
          - os: macos-latest
            asset: regexmate-macos-aarch64
            archive: tar.gz
            racket-arch: arm64
          - os: windows-latest
            asset: regexmate-windows-x86_64
            archive: zip
            racket-arch: x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Racket (full CS distribution — rivet needs the boot files)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: '9.3'
          architecture: ${{ matrix.racket-arch }}
          distribution: full
          variant: CS

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgtk-4-dev libglib2.0-dev libsecret-1-dev

      - name: Install Rivet (native GUI host toolchain)
        run: raco pkg install --auto https://github.com/turinglambdaai/rivet.git

      - name: Build embeddable Racket CS (Linux GUI needs the static runtime)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/racket-minimal-9.3-src-builtpkgs.tgz"
          source_root="$RUNNER_TEMP/racket-9.3"
          build_root="$RUNNER_TEMP/racket-embed-build"
          embed_prefix="$RUNNER_TEMP/racket-embed"

          curl --fail --location --retry 3 \
            --output "$archive" \
            https://download.racket-lang.org/releases/9.3/installers/racket-minimal-9.3-src-builtpkgs.tgz
          echo "3a01324d559a15e3f1f58b0c57a92bb344dce534e72e564e0d8b75e3b9c65295  $archive" |
            sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          mkdir -p "$build_root"
          cd "$build_root"
          "$source_root/src/configure" --prefix="$embed_prefix"
          make -j"$(nproc)"
          make install

          echo "RIVET_RACKET_LIBRARY=$embed_prefix/lib/libracketcs.a" >> "$GITHUB_ENV"
          echo "RIVET_RACKET_INCLUDE=$embed_prefix/include" >> "$GITHUB_ENV"
          echo "RIVET_RACKET_LIB_DIR=$embed_prefix/lib" >> "$GITHUB_ENV"

      - name: Compile
        run: raco make main.rkt

      - name: Build CLI executable
        shell: bash
        run: |
          mkdir -p build
          case '${{ runner.os }}' in
            Windows) raco exe -o build/regexmate.exe main.rkt ;;
            *)       raco exe -o build/regexmate main.rkt ;;
          esac
          ls -la build

      - name: Bundle CLI runtime
        shell: bash
        run: |
          set -x
          case '${{ runner.os }}' in
            Windows) raco distribute stage build/regexmate.exe ;;
            *)       raco distribute stage build/regexmate ;;
          esac

      - name: Build native GUI and bundle into the archive (Windows + Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          raco rivet package
          mkdir -p stage/gui
          GUI_DIR=$(find dist -maxdepth 1 -type d -name 'regexmate-gui-*' | head -1)
          cp -r "$GUI_DIR"/* stage/gui/
          rm -f stage/gui/*.pdb stage/gui/*.exp stage/gui/*.lib
          # the WinUI runtime resolves <exe-name>.pri/.winmd next to the exe
          if [ '${{ runner.os }}' = 'Windows' ]; then
            mv stage/gui/RivetHost.exe stage/gui/regexmate-gui.exe
            mv stage/gui/RivetHost.pri stage/gui/regexmate-gui.pri
            mv stage/gui/RivetHost.winmd stage/gui/regexmate-gui.winmd
          fi
          ls -la stage/gui

      - name: Smoke the bundled binary
        shell: bash
        run: |
          # unix distribute uses bin/ layout; windows stays flat
          EXE=stage/bin/regexmate
          [ '${{ runner.os }}' = 'Windows' ] && EXE=stage/regexmate.exe
          "$EXE" --version
          "$EXE" validate '^\d{3}-\d{4}$'
          "$EXE" match '\d+' 'abc 123' --json
          "$EXE" explain '(?:\d{2,4}|[a-z]+)(?=x)' --json
          "$EXE" replace '(\w+)@(\w+)' '\1 at \2' 'a@b' --json
          "$EXE" graph 'ab(c|d)*[0-9]+' -o smoke.svg
          test -s smoke.svg
          # the rivet-built native GUI ships in the windows/linux archives
          if [ '${{ runner.os }}' = 'Windows' ]; then
            test -f stage/gui/regexmate-gui.exe
            test -f stage/gui/runtime/racket.boot
          elif [ '${{ runner.os }}' = 'Linux' ]; then
            test -f stage/gui/RivetHost
            test -f stage/gui/runtime/racket.boot
          fi
          set +e
          "$EXE" match 'nomatchpattern' 'text' >/dev/null
          code=$?
          set -e
          test "$code" -eq 3

      - name: Build standalone single-file CLI (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          raco exe --embed-dlls -o "regexmate-standalone-windows-x86_64-v${VERSION}.exe" main.rkt
          # verify it truly runs standalone: no sibling runtime, empty dir
          mkdir -p standalone-check
          cp "regexmate-standalone-windows-x86_64-v${VERSION}.exe" standalone-check/regexmate.exe
          ./standalone-check/regexmate.exe --version
          ./standalone-check/regexmate.exe match '\d+' 'abc 123' --json
          ./standalone-check/regexmate.exe graph 'ab(c|d)*[0-9]+' -o standalone-check/s.svg
          test -s standalone-check/s.svg

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "${{ matrix.asset }}-v${VERSION}.tar.gz" -C stage .

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          Compress-Archive -Path stage/* -DestinationPath "regexmate-windows-x86_64-v$version.zip"

      - name: Checksum
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ '${{ matrix.archive }}' = 'zip' ]; then
            ARCHIVE="regexmate-windows-x86_64-v${VERSION}.zip"
          else
            ARCHIVE="${{ matrix.asset }}-v${VERSION}.tar.gz"
          fi
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          cat "$ARCHIVE.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            regexmate-*-v*.tar.gz
            regexmate-*-v*.zip
            regexmate-*-v*.sha256
            regexmate-standalone-*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          for f in regexmate-*v*.tar.gz regexmate-*v*.zip regexmate-standalone-*.exe; do
            [ -f "$f" ] || continue
            sha256sum "$f"
          done > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Build release body (changelog section + checksums)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # heading looks like "## [1.0.0] — 2026-09-28"; match the bracketed prefix
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "See CHANGELOG.md for details." > release-body.md
          fi
          {
            echo ""
            echo "Standalone binaries — no Racket installation required."
            echo ""
            echo "### Checksums (SHA-256)"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/regexmate-*-v*.tar.gz
            artifacts/regexmate-*-v*.zip
            artifacts/regexmate-*-v*.sha256
            artifacts/regexmate-standalone-*.exe
            SHA256SUMS
          body_path: release-body.md
          generate_release_notes: true
